<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fokus-Postfach</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">Fokus-Postfach</span>
      <span class="badge" id="modeBadge" hidden></span>
    </div>
    <div class="sync">
      <span class="muted" id="lastSync"></span>
      <button class="btn ghost" id="resetBtn" hidden>Demo zurücksetzen</button>
      <button class="btn" id="syncBtn">Postfächer prüfen</button>
    </div>
  </header>

  <main class="wrap">
    <div id="errors"></div>

    <nav class="tabs" id="tabs" aria-label="Ansichten"></nav>
    <div class="chips" id="chips" aria-label="Postfach-Filter"></div>

    <section id="view" aria-live="polite"></section>
  </main>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
